name: Redteam

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  issues: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt -r infra/requirements.txt pytest black

      - name: Lint
        run: make lint

      - name: Test
        run: make test

  # Promptfoo red-team scan — NIST AI RMF MEASURE-2.4/2.7/2.8/2.11 evidence.
  # Runs only on manual dispatch in its own workflow so it is not shown as a
  # skipped job on every push/PR CI run.
  redteam:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Validate red-team configuration
        env:
          AWS_ROLE_TO_ASSUME: ${{ secrets.AWS_ROLE_TO_ASSUME }}
        run: |
          test -n "$AWS_ROLE_TO_ASSUME" || {
            mkdir -p compliance
            printf '{"status":"not_run","reason":"Missing AWS_ROLE_TO_ASSUME secret"}\n' > compliance/redteam-report.json
            echo "Missing AWS_ROLE_TO_ASSUME secret. Deploy the CDK GitHub Actions stack and store its role ARN as this repository secret."
            exit 1
          }

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: us-east-1

      - name: Prepare promptfoo configuration
        run: python compliance/prepare_promptfoo_config.py
        env:
          GUARDRAIL_ID: ${{ secrets.GUARDRAIL_ID }}
          GUARDRAIL_VERSION: ${{ secrets.GUARDRAIL_VERSION || 'DRAFT' }}

      - name: Run promptfoo red-team scan
        run: |
          set +e
          npx promptfoo@0.121.2 redteam run --config compliance/promptfoo-redteam.ci.yaml --output compliance/redteam-report.json
          python compliance/check_redteam_score.py
        env:
          AWS_REGION: us-east-1
          GUARDRAIL_ID: ${{ secrets.GUARDRAIL_ID }}
          GUARDRAIL_VERSION: ${{ secrets.GUARDRAIL_VERSION || 'DRAFT' }}

      - name: Upload red-team report
        if: always() # Upload even on failure — report contains evidence of what failed
        uses: actions/upload-artifact@v4
        with:
          name: redteam-report
          path: compliance/redteam-report.json
          retention-days: 90 # NIST audit evidence retention

      - name: Write compliance gap summary on failure
        if: failure()
        run: |
          echo "## Red-Team Scan Failed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "NIST AI RMF evidence gap: the manually triggered red-team scan did not complete." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Check the [run logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) and re-trigger this workflow once the issue is resolved." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Common causes and fixes:**" >> $GITHUB_STEP_SUMMARY
          echo "- OIDC provider missing: \`cd infra && cdk deploy GitHubActionsStack\`" >> $GITHUB_STEP_SUMMARY
          echo "- AWS_ROLE_TO_ASSUME secret missing: set it to the role ARN from the CDK stack output" >> $GITHUB_STEP_SUMMARY

      - name: Create GitHub issue on scan failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "Red-team scan failed $(date -u +%Y-%m-%d)" \
            --body "The manually triggered NIST AI RMF red-team scan failed on $(date -u +%Y-%m-%dT%H:%M:%SZ).

          **Run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          This creates a gap in NIST AI RMF compliance evidence (MEASURE-2.4/2.7/2.8/2.11). Investigate and re-run the workflow once fixed.

          **Common fix:** If the error is \`No OpenIDConnect provider found\`, deploy the CDK infrastructure:
          \`\`\`
          cd infra && cdk deploy GitHubActionsStack
          \`\`\`" \
            --label "compliance" \
          || echo "Issue creation skipped (label may not exist — create a 'compliance' label to enable this)"
