name: Redteam

on:
  schedule:
    - cron: "0 6 * * 1" # Weekly Monday 6am UTC
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt -r infra/requirements.txt pytest black

      - name: Lint
        run: make lint

      - name: Test
        run: make test

  # Promptfoo red-team scan — NIST AI RMF MEASURE-2.4/2.7/2.8/2.11 evidence.
  # Runs weekly and on manual dispatch in its own workflow so it is not shown as
  # a skipped job on every push/PR CI run.
  redteam:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Validate red-team configuration
        env:
          AWS_ROLE_TO_ASSUME: ${{ secrets.AWS_ROLE_TO_ASSUME }}
        run: |
          test -n "$AWS_ROLE_TO_ASSUME" || {
            mkdir -p compliance
            printf '{"status":"not_run","reason":"Missing AWS_ROLE_TO_ASSUME secret"}\n' > compliance/redteam-report.json
            echo "Missing AWS_ROLE_TO_ASSUME secret. Deploy the CDK GitHub Actions stack and store its role ARN as this repository secret."
            exit 1
          }

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: us-east-1

      - name: Prepare promptfoo configuration
        run: python compliance/prepare_promptfoo_config.py
        env:
          GUARDRAIL_ID: ${{ secrets.GUARDRAIL_ID }}

      - name: Run promptfoo red-team scan
        run: npx promptfoo@0.121.2 redteam run --config compliance/promptfoo-redteam.ci.yaml --output compliance/redteam-report.json
        env:
          AWS_REGION: us-east-1
          GUARDRAIL_ID: ${{ secrets.GUARDRAIL_ID }}
          GUARDRAIL_VERSION: ${{ secrets.GUARDRAIL_VERSION || 'DRAFT' }}

      - name: Upload red-team report
        if: always() # Upload even on failure — report contains evidence of what failed
        uses: actions/upload-artifact@v4
        with:
          name: redteam-report
          path: compliance/redteam-report.json
          retention-days: 90 # NIST audit evidence retention
