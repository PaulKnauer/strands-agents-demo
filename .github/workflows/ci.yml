name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1" # Weekly Monday 6am UTC — triggers redteam job
  workflow_dispatch: # Manual trigger — also triggers redteam job

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt pytest black

      - name: Lint
        run: make lint

      - name: Test
        run: make test

  # Promptfoo red-team scan — NIST AI RMF MEASURE-2.4/2.7/2.8/2.11 evidence.
  # Runs ONLY on weekly schedule or manual dispatch (NOT on every push/PR) to
  # avoid LLM API costs. Requires AWS credentials and GUARDRAIL_ID in secrets.
  # Report uploaded as artifact for 90-day audit evidence retention.
  redteam:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run promptfoo red-team scan
        run: npx promptfoo@latest redteam run --config compliance/promptfoo-redteam.yaml --output compliance/redteam-report.json
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: us-east-1
          GUARDRAIL_ID: ${{ secrets.GUARDRAIL_ID }}
          GUARDRAIL_VERSION: ${{ secrets.GUARDRAIL_VERSION }}

      - name: Upload red-team report
        if: always() # Upload even on failure — report contains evidence of what failed
        uses: actions/upload-artifact@v4
        with:
          name: redteam-report
          path: compliance/redteam-report.json
          retention-days: 90 # NIST audit evidence retention
